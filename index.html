<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <script>try{document.documentElement.dataset.theme=localStorage.getItem('lovable-hub-theme')==='light'?'light':'dark'}catch{}</script>
    <style>html{--boot-background:#1b1b1b;--boot-text:rgba(255,255,255,.92);color-scheme:dark}html[data-theme='light']{--boot-background:#f7f4ed;--boot-text:rgba(0,0,0,.92);color-scheme:light}html,body{background:var(--boot-background);color:var(--boot-text)}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1b1b" />
    <meta name="description" content="The Lovable partner hub." />
    <title>Partners</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="/fonts/CameraPlainVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="hub-header" aria-label="Partner hub">
      <div class="header-start">
        <div class="segmented workspace-switcher" role="group" aria-label="Workspaces">
          <button class="icon-segment" data-workspace="lovable" aria-label="Lovable" title="Lovable" aria-disabled="true">
            <svg class="icon lovable-mark" viewBox="0 0 42.5092 43.2257" fill="currentColor" aria-hidden="true">
              <path d="M12.7548 0C19.7991 0 25.5096 5.72557 25.5096 12.7884V17.6488H29.7544C36.7987 17.6488 42.5092 23.3744 42.5092 30.4373C42.5092 37.5001 36.7987 43.2257 29.7544 43.2257H0V12.7884C0 5.72557 5.71052 0 12.7548 0Z" />
            </svg>
          </button>
          <button class="icon-segment is-selected" data-workspace="partners" aria-label="Partners" title="Partners" aria-pressed="true">
            <svg class="partner-workspace-mark" viewBox="0 0 160 160" fill="none" aria-hidden="true">
              <rect x="2" y="2" width="156" height="156" rx="34" stroke="currentColor" stroke-width="4" />
              <svg x="32.6483" y="32" width="94.7034" height="96" viewBox="0 0 82.2357 83.3616" fill="currentColor"><path d="M24.6746 0C38.3019 0 49.3493 11.0419 49.3493 24.6628V34.0361H57.5613C71.1884 34.0361 82.2357 45.0781 82.2357 58.6989C82.2357 72.32 71.1884 83.3616 57.5613 83.3616H0V24.6628C0 11.0419 11.0472 0 24.6746 0Z"/></svg>
            </svg>
          </button>
        </div>
      </div>

      <nav class="segmented section-switcher" aria-label="Main navigation">
        <button class="text-segment" data-view="gallery">Gallery</button>
        <button class="text-segment is-selected" data-view="guidelines" aria-current="page">Guidelines</button>
        <button class="text-segment" data-view="create">Make your own</button>
      </nav>

      <div class="header-end">
        <button class="icon-control" id="theme-toggle" aria-label="Switch to light appearance" title="Switch appearance">
          <i data-icon="moon" aria-hidden="true"></i>
        </button>
        <button class="icon-control" id="search-toggle" aria-label="Search" title="Search">
          <i data-icon="search" aria-hidden="true"></i>
        </button>
      </div>
    </header>
    <main id="app"></main>
    <dialog id="search-dialog" aria-labelledby="search-title">
      <div class="search-top"><i data-icon="search" aria-hidden="true"></i><label id="search-title" class="sr-only" for="search-input">Search the partner hub</label><input id="search-input" type="search" placeholder="Search badges, spacing, guidelines…" autocomplete="off" /><button class="subtle-button" id="close-search" aria-label="Close search"><i data-icon="x" aria-hidden="true"></i></button></div>
      <div id="search-results"></div>
      <p class="search-hint">Find a format or jump to a guideline.</p>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
