<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1b1b" />
    <meta name="description" content="The Lovable partner hub." />
    <title>Partners</title>
    <link rel="icon" href="data:," />
    <link rel="preload" href="/fonts/CameraPlainVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="hub-header" aria-label="Partner hub header preview">
      <div class="header-start">
        <span class="icon-control" role="img" aria-label="Home" title="Home">
          <i data-icon="house" aria-hidden="true"></i>
        </span>
        <div class="segmented workspace-switcher" role="group" aria-label="Workspaces">
          <span class="icon-segment is-selected" role="img" aria-label="All partners, selected" title="All partners">
            <i data-icon="grid" aria-hidden="true"></i>
          </span>
          <span class="icon-segment" role="img" aria-label="Lovable" title="Lovable">
            <svg class="icon lovable-mark" viewBox="0 0 42.5092 43.2257" fill="currentColor" aria-hidden="true">
              <path d="M12.7548 0C19.7991 0 25.5096 5.72557 25.5096 12.7884V17.6488H29.7544C36.7987 17.6488 42.5092 23.3744 42.5092 30.4373C42.5092 37.5001 36.7987 43.2257 29.7544 43.2257H0V12.7884C0 5.72557 5.71052 0 12.7548 0Z" />
            </svg>
          </span>
        </div>
      </div>

      <div class="segmented section-switcher" role="group" aria-label="Sections">
        <span class="text-segment">Library</span>
        <span class="text-segment is-selected" aria-current="page">Guidelines</span>
        <span class="text-segment">Create</span>
      </div>

      <div class="header-end">
        <span class="icon-control" role="img" aria-label="Dark appearance" title="Dark appearance">
          <i data-icon="moon" aria-hidden="true"></i>
        </span>
        <span class="icon-control" role="img" aria-label="Search" title="Search">
          <i data-icon="search" aria-hidden="true"></i>
        </span>
      </div>
    </header>
    <main>
      <h1>Partners</h1>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
