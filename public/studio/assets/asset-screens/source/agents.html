<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agents — Acme screen</title><link rel="stylesheet" href="/assets/asset-screens/source/screens.css"></head><body><div id="screen" class="screen-canvas" aria-label="Agents screen"><div class="sales-room agents-room" aria-hidden="true">
  <div class="organize-sidebar">
  <img class="organize-mark" src="/assets/asset-screens/source/assets/asset-mark.svg" width="24" height="16" alt="" />
  <div class="organize-navigation"><span class="room-tab room-tab--active" data-page="Acme AI"><svg class="icon " aria-hidden="true" focusable="false"><use href="/assets/asset-screens/source/assets/navigation-icons.svg#square-sparkles"></use></svg></span><span class="room-tab" data-page="Workspaces"><svg class="icon " aria-hidden="true" focusable="false"><use href="/assets/asset-screens/source/assets/navigation-icons.svg#panels-top-left"></use></svg></span><span class="room-tab" data-page="Library"><svg class="icon " aria-hidden="true" focusable="false"><use href="/assets/asset-screens/source/assets/navigation-icons.svg#library"></use></svg></span><span class="room-tab" data-page="Slides"><svg class="icon " aria-hidden="true" focusable="false"><use href="/assets/asset-screens/source/assets/navigation-icons.svg#presentation"></use></svg></span><span class="room-tab" data-page="Learning"><svg class="icon " aria-hidden="true" focusable="false"><use href="/assets/asset-screens/source/assets/navigation-icons.svg#route"></use></svg></span></div>
  <span class="room-workspace-mark room-user-portrait organize-avatar"></span>
</div>
  <div class="room-header">
    <span class="room-medium">Acme AI</span>
    <span class="room-inline room-header-actions"><span class="button button--primary">Create agent</span></span>
  </div>
  <div class="agents-chat-sidebar">
    <div class="agents-chat-group">
      <span class="room-inline agents-chat-link agents-chat-link--active"><svg class="icon " aria-hidden="true" focusable="false"><use href="/assets/asset-screens/source/assets/navigation-icons.svg#square-pen"></use></svg>New chat</span>
      <span class="room-inline agents-chat-link"><svg class="icon " aria-hidden="true" focusable="false"><use href="/assets/asset-screens/source/assets/navigation-icons.svg#search"></use></svg>Search chats</span>
    </div>
    <div class="agents-chat-group">
      <span class="room-caption agents-chat-label">Agents</span>
      <span class="room-inline agents-chat-link"><svg class="icon " aria-hidden="true" focusable="false"><use href="/assets/asset-screens/source/assets/navigation-icons.svg#square-sparkles"></use></svg>Sales Question</span><span class="room-inline agents-chat-link"><svg class="icon " aria-hidden="true" focusable="false"><use href="/assets/asset-screens/source/assets/navigation-icons.svg#file-text"></use></svg>Find Asset</span>
    </div>
    <div class="agents-chat-group">
      <span class="room-caption agents-chat-label">Recents</span>
      <span class="agents-chat-link">Data Residency in…</span><span class="agents-chat-link">Acme Business Case…</span><span class="agents-chat-link">Chat Title Generator</span><span class="agents-chat-link">Chat Test</span>
    </div>
  </div>
  <div class="agents-chat-body">
    <div class="agents-conversation">
      <div class="room-heading">How can I help you today?</div>
      <div class="room-composer room-composer--stacked room-composer--agent">
  <span class="room-composer-prompt">Build a business case for Acme.</span>
  <div class="room-inline room-composer-actions">
    <span class="room-inline room-composer-tools"><span class="room-composer-tool"><svg class="icon " aria-hidden="true" focusable="false"><use href="/assets/asset-screens/source/assets/navigation-icons.svg#plus"></use></svg></span><span class="room-inline room-composer-agent"><span class="room-composer-tool"><svg class="icon icon--asset-agent " aria-hidden="true" focusable="false"><use href="/assets/asset-screens/source/assets/navigation-icons.svg#asset-agent"></use></svg></span><span>Pick agent</span></span></span>
    <span class="room-send"><svg class="icon " aria-hidden="true" focusable="false"><use href="/assets/asset-screens/source/assets/navigation-icons.svg#arrow-up"></use></svg></span>
  </div>
</div>
      <div class="room-inline agents-suggestions"><span class="button agents-browse">Browse agents</span></div>
    </div>
  </div>
</div></div></body></html>
